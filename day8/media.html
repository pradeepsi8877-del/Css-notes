<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries</title>

   <style>

.container{
    background-color: green;
    height: 600px;
    width: 100%;
    display: flex;
    flex-direction: row;
}

.box1{
    background-color: yellow;
    height: 200px;
    width: 200px;
}

.box2{
    background-color: orange;
    height: 200px;
    width: 200px;
}

.box4{
    background-color: red;
    height: 200px;
    width: 200px;
}

@media(width <= 500px){
    .container{
        display: flex;
        flex-direction: column;
    }
}

@media(width>=768px){
   .container{
        display: flex;
        flex-direction: row-reverse;
    } 
}

   </style>
</head>
<body>
    <div class="container">
        <div class="box1">Box1</div>
        <div class="box2">Box2</div>
        <div class="box4">Box3</div>
    </div>
    
</body>
</html>
