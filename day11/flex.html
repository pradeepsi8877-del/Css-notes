<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Properties</title>
    <style>
        .container{
            height: 600px;
            width: 100%;
            border: 1px solid black;

            /* flex properties takes on container  */
            display: flex;
            /* flex-direction: column;
            flex-direction: column-reverse; */
            flex-direction: row;
            /* flex-wrap: wrap; */

            /* it work on main axis which is horizontal  */
            justify-content: center;
            /* justify-content: end; 
            justify-content: space-between;
            justify-content: space-around;
            justify-content: space-evenly; */
            /* justify-content: flex-start; */

            /* it work on cross axis which is vertical  */
            align-items: center;
            /* align-items: end; */
            /* align-items: flex-start; */
        }
        .box1{
            height: 150px;
            width: 150px;
            background-color: red;
            /* it change the position of the element. 
            it value varies on 0 to 1  */
            /* order: 0; */
        }
         .box2{
            height: 150px;
            width: 150px;
            background-color: orange;
             /* .
            it value varies on 1 to 2 */
            /* flex-grow: 2; */
        }
         .box3{
            height: 150px;
            width: 150px;
            background-color: yellow;
   /* .
            it value varies on 1 to 2 */
            flex-shrink: 2;
        }
         .box4{
            height: 150px;
            width: 150px;
            background-color: green;
            /* it takes width  */
            flex-basis: 400px;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="box1">1</div>
        <div class="box2">2</div>
        <div class="box3">3</div>
        <div class="box4">4</div>
    </div>
</body>
</html>
