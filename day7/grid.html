        .container{
            height: 400px;
            width: 100%;
            border: 2px solid;
        }

        .translate{
            height: 100px;
            width: 100px;
            background-color: red;
            border: 2px solid black;
        }
        .translate:hover{
             transition: transform 5s;
            transform: translate(20px ,10px);
        }

         .scale{
            height: 100px;
            width: 100px;
            background-color: rgb(0, 17, 255);
            border: 2px solid black;
        
        }
        .scale:hover{
             transition: transform 2s;
            transform: scale(1.5);
        }

         .rotate{
            height: 100px;
            width: 100px;
            background-color: red;
            border: 2px solid black;
        
        }
        .rotate:hover{
             transition: transform 5s;
            transform: rotate(45deg);
        }

         .skew{
            height: 100px;
            width: 100px;
            background-color: red;
            border: 2px solid black;
        
        }
        .skew:hover{
             transition: transform 5s;
            transform: skew(45deg);
        }

    </style>
