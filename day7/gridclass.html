        .translate{
            height: 100px;
            width: 100px;
            border: 2px solid black;
            background-color: red;
        }

        .translate:hover{
            transition: transform 3s;
            transform: translate(20px, 10px);
        }

        
        .scale{
            height: 100px;
            width: 100px;
            border: 2px solid black;
            background-color: rgb(111, 0, 255);
        }

        .scale:hover{
            transition: transform 10s;
            transform: scale(1.5);
        }

        
        .rotate{
            height: 100px;
            width: 100px;
            border: 2px solid black;
            background-color: red;
        }

        .rotate:hover{
            transition: transform 3s;
            transform: rotate(360deg);
        }

        
        .skew{
            height: 100px;
            width: 100px;
            border: 2px solid black;
            background-color: red;
        }

        .skew:hover{
            transition: transform 3s;
            transform: skew(45deg);
        }

    </style>
</head>
<body>
